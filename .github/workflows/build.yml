name: Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]

# Cancela builds antigos do mesmo branch/tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # necessário para criar GitHub Release

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ---------- 1. Checkout ----------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 2. JDK 17 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 3. Gradle + cache automático ----------
      - name: Setup Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache de leitura em PRs para não poluir o cache do main
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # ---------- 4. Permissão do wrapper ----------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------- 5. Lint ----------
      - name: Lint (debug)
        run: ./gradlew lintDebug --no-daemon

      # ---------- 6. Testes unitários ----------
      - name: Unit tests (debug)
        run: ./gradlew testDebugUnitTest --no-daemon

      # ---------- 7. Build debug (só em push/PR, não em tag) ----------
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: vztune-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ---------- 8. Upload do relatório de lint (sempre) ----------
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      # ============================================================
      # RELEASE — só roda quando a ref é uma tag v*.*.*
      # ============================================================

      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: vztune-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false