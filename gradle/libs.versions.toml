# ============================================================
# VzTune - Version Catalog
# ============================================================
# Structure:
#   [versions]  -> version numbers only (strings)
#   [libraries] -> dependency coordinates (group + name + version.ref)
#   [plugins]   -> Gradle plugin coordinates
#
# Rule: `desugar-jdk-libs` here becomes `libs.desugar.jdk.libs` in Kotlin.
#       Each `-` becomes a `.`.
# ============================================================


# ============================================================
# VERSIONS
# ============================================================
[versions]

# ---- Build tools ----
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"

# ---- AndroidX core ----
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"

# ---- Compose ----
composeBom = "2024.12.01"
navigationCompose = "2.8.5"

# ---- Dependency Injection ----
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
hiltWork = "1.2.0"

# ---- Media3 (ExoPlayer) ----
media3 = "1.5.0"

# ---- Room (local DB) ----
room = "2.6.1"

# ---- DataStore (preferences) ----
datastore = "1.1.1"

# ---- WorkManager (background jobs) ----
work = "2.10.0"

# ---- Coroutines / Serialization ----
coroutines = "1.9.0"
serialization = "1.7.3"

# ---- Networking / Images ----
coil = "2.7.0"
okhttp = "4.12.0"

# ---- Extractors (from JitPack) ----
newpipeExtractor = "v0.26.5"
# InnerTube is NOT published as a standalone JitPack artifact.
# It will be ported as an internal source module later (like InnerTune does).
# innertube = "TBD"

# ---- Core library desugaring (required by NewPipe on minSdk < 33) ----
desugarJdkLibs = "2.1.4"

# ---- Tests ----
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

# ---- palette ----
palette = "1.0.0"

# ---- reordederable ---- 
reorderable = "3.1.0"


# ============================================================
# LIBRARIES
# ============================================================
[libraries]

# ---- AndroidX core ----
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ---- Compose (BOM manages all Compose artifact versions) ----
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ---- Hilt (DI) ----
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }

# ---- Media3 (audio playback) ----
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# ---- Room (local database) ----
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ---- DataStore (preferences storage) ----
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ---- WorkManager (background / downloads) ----
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# ---- Coroutines / Serialization ----
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# ---- Networking / Images ----
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# ---- Extractors ----
newpipe-extractor = { group = "com.github.teamnewpipe", name = "NewPipeExtractor", version.ref = "newpipeExtractor" }
# InnerTube: to be added as a source module inside :data later.
# innertube = { group = "com.github.z-huang", name = "InnerTube", version.ref = "innertube" }

# ---- Core library desugaring (NewPipe requirement) ----
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs_nio", version.ref = "desugarJdkLibs" }

# ---- Tests ----
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

# ----palette ----
androidx-palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }

# ---- reordederable ----
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }

# ============================================================
# PLUGINS
# ============================================================
[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }